name: Deploy Vue Project to BT Panel

# 👇 增加以下配置：同一时间同一个分支只允许跑一个任务，新的会顶替掉旧的
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 触发条件：当 main 分支有 push 时触发（如果你的主分支叫 master，请把下面改成 master）
on:
  push:
    branches:
      - master
  workflow_dispatch: # 👈 加上这一行，就可以手动点按钮运行

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取 GitHub 仓库中的最新代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装 Node.js 环境（这里选了 v18，你可以根据你的 Vue 项目需求调整版本）
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3. 针对于 npm 的缓存机制优化
      - name: Cache npm Modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      # 4. 安装依赖
      - name: Install Dependencies
        run: npm ci

      # 5. 打包项目
      - name: Build Project
        run: npm run build

      # 4. 通过 SSH/SFTP 把打包好的 dist 目录传送到宝塔服务器
      - name: Deploy to BT Server
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SOURCE: 'dist/' # 你的 Vue 打包产物目录
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_PORT: ${{ secrets.SERVER_PORT }}
          REMOTE_USER: 'root'
          TARGET: '/www/wwwroot/tdywork.cn' # ⚠️请把这里改成你在宝塔中真实的网站根目录路径！
          # 👇 添加以下两行：开启压缩传输并保持时间戳，实现精准增量更新
          ARGS: '-avzr --delete --exclude=.user.ini'
          SCRIPT_AFTER: |
            chown -R www:www /www/wwwroot/tdywork.cn
            chmod -R 755 /www/wwwroot/tdywork.cn
            echo 'Deployment complete!'